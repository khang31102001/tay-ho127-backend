name: CI

on:
  push:
    branches: [main, production, uat, dev]
  pull_request:
    branches: [main, production, uat, dev]

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AdminPlatform.sln

      - name: Format check (lint)
        run: dotnet format AdminPlatform.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build AdminPlatform.sln --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/AdminPlatform.UnitTests/AdminPlatform.UnitTests.csproj --no-build -c Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Architecture tests
        run: dotnet test tests/AdminPlatform.ArchitectureTests/AdminPlatform.ArchitectureTests.csproj --no-build -c Release --logger "trx;LogFileName=architecture.trx" --results-directory TestResults

      - name: Migration validation (no pending model changes)
        run: |
          dotnet tool install --global dotnet-ef --version 8.*
          for pair in \
            "src/Modules/Identity/AdminPlatform.Modules.Identity/AdminPlatform.Modules.Identity.csproj:AdminPlatform.Modules.Identity.Infrastructure.IdentityDbContext" \
            "src/Modules/AccessControl/AdminPlatform.Modules.AccessControl/AdminPlatform.Modules.AccessControl.csproj:AdminPlatform.Modules.AccessControl.Infrastructure.AccessControlDbContext" \
            "src/Modules/Organization/AdminPlatform.Modules.Organization/AdminPlatform.Modules.Organization.csproj:AdminPlatform.Modules.Organization.Infrastructure.OrganizationDbContext" \
            "src/Modules/Navigation/AdminPlatform.Modules.Navigation/AdminPlatform.Modules.Navigation.csproj:AdminPlatform.Modules.Navigation.Infrastructure.NavigationDbContext" \
            "src/Modules/Platform/AdminPlatform.Modules.Platform/AdminPlatform.Modules.Platform.csproj:AdminPlatform.Modules.Platform.Infrastructure.PlatformDbContext" \
            "src/Modules/Media/AdminPlatform.Modules.Media/AdminPlatform.Modules.Media.csproj:AdminPlatform.Modules.Media.Infrastructure.MediaDbContext" ; do
            project="${pair%%:*}"
            context="${pair##*:}"
            echo "::group::has-pending-model-changes — $context"
            dotnet ef migrations has-pending-model-changes --project "$project" --context "$context"
            echo "::endgroup::"
          done
        env:
          ConnectionStrings__Default: "Host=localhost;Database=adminplatform;Username=postgres;Password=postgres"

      - name: Integration tests (Testcontainers — needs Docker, available on this runner)
        timeout-minutes: 4
        run: dotnet test tests/AdminPlatform.IntegrationTests/AdminPlatform.IntegrationTests.csproj --no-build -c Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  # Chỉ chạy khi push vào production VÀ job kiểm tra phía trên xanh.
  deploy:
    needs: build-lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tayho-api:latest
            ghcr.io/${{ github.repository_owner }}/tayho-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tayho-migrator:latest
            ghcr.io/${{ github.repository_owner }}/tayho-migrator:${{ github.sha }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          # db lên trước -> migrator áp migration -> mới thay API (không chạy migrator hai lần nhờ --no-deps).
          ssh "$VPS_USER@$VPS_HOST" "cd /opt/tayho && docker compose pull api migrator && docker compose up -d db && docker compose run --rm migrator all && docker compose up -d --no-deps api && docker image prune -f"
