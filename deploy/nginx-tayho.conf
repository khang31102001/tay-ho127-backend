# Đặt tại /etc/nginx/sites-available/tayho rồi: ln -s vào sites-enabled, xoá default, nginx -t && systemctl reload nginx
# Chưa có domain: server_name _ (khớp mọi host, truy cập bằng IP). Có domain thì thay bằng tên miền rồi chạy certbot.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;

    # Ảnh Admin upload do API phục vụ (StaticFiles); chỉ proxy đúng đường dẫn này, không lộ phần còn lại của API.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        # Phản hồi đăng nhập mang nhiều Set-Cookie (token + phiên); bộ đệm mặc định 4k làm nginx báo 502
        # "upstream sent too big header". Để dư hơn nhiều so với kích thước token hiện tại.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
