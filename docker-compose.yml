services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adminplatform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - adminplatform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-adminplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot deployment job: applies pending migrations, then seeds. Not a long-running service —
  # exits after it finishes. Run it again any time with `docker compose run --rm migrator seed`.
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: ["all"]
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-adminplatform};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      SEED_ADMIN_FULLNAME: ${SEED_ADMIN_FULLNAME:-Super Admin}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-adminplatform};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-AdminPlatform}
      Jwt__Audience: ${JWT_AUDIENCE:-AdminPlatform.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required (base64, at least 32 bytes)}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
      Esms__ApiKey: ${ESMS_API_KEY:-}
      Esms__SecretKey: ${ESMS_SECRET_KEY:-}
      Esms__Channel: ${ESMS_CHANNEL:-Zalo}
      Esms__Sandbox: ${ESMS_SANDBOX:-false}
      Esms__ZaloOaId: ${ESMS_ZALO_OA_ID:-}
      Esms__ZaloOtpTemplateId: ${ESMS_ZALO_OTP_TEMPLATE_ID:-}
      Esms__ZaloOrderPlacedTemplateId: ${ESMS_ZALO_ORDER_PLACED_TEMPLATE_ID:-}
      Esms__SmsBrandName: ${ESMS_SMS_BRAND_NAME:-}
      Esms__SmsType: ${ESMS_SMS_TYPE:-8}
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  adminplatform_pgdata:
